name: Enterprise Quality Engineering Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:


# Enterprise least-privilege permissions
permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write


# Prevent duplicate executions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  NODE_VERSION: 20
  SONAR_ENABLED: false


jobs:

# =====================================================
# Security & Quality Gates
# =====================================================

  security-quality-gates:

    name: Security Scanning and Quality Gates

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Install dependencies
        run: npm ci


# -------------------------------
# Code Quality Validation
# -------------------------------

      - name: Run ESLint
        run: npm run lint


      - name: TypeScript Validation
        run: npm run typecheck


# -------------------------------
# Dependency Security
# -------------------------------

      - name: Run npm security audit
        run: npm audit --audit-level=high



# -------------------------------
# GitHub CodeQL Security Analysis
# -------------------------------

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript


      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"



# -------------------------------
# SonarQube / SonarCloud Analysis
# -------------------------------

      - name: SonarQube Analysis
        if: env.SONAR_ENABLED == 'true'

        uses: SonarSource/sonarqube-scan-action@v5

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        with:
          args: >
            -Dsonar.projectKey=enterprise-playwright-test-automation-framework
            -Dsonar.projectName=Enterprise Playwright Test Automation Framework
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=node_modules/**,playwright-report/**,test-results/**



# =====================================================
# Playwright Automated Testing
# =====================================================
  playwright-tests:


    name: Playwright Automation Tests

    needs: security-quality-gates

    runs-on: ubuntu-latest

    timeout-minutes: 60


    steps:


      - name: Checkout repository
        uses: actions/checkout@v7



      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm



      - name: Install dependencies
        run: npm ci



      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium firefox webkit



      - name: Execute Playwright Tests
        run: |
          npx playwright test --reporter=github,line



# -------------------------------
# Test Reporting
# -------------------------------

      - name: Upload Playwright Report

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: playwright-report

          path: |
            playwright-report/
            test-results/

          retention-days: 30



      - name: Upload Trace Files

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: playwright-traces

          path: |
            test-results/**/*.zip

          retention-days: 30