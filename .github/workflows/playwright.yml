name: Playwright Enterprise CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

# Least privilege permissions
permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

# ============================================
# Security and Quality Gates
# ============================================

  security-quality-gates:

    name: Security Scanning & Quality Gates

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm


    - name: Install dependencies
      run: npm ci


# -------------------------------
# Code Quality
# -------------------------------

    - name: Run ESLint
      run: npm run lint


    - name: TypeScript validation
      run: npm run typecheck



# -------------------------------
# Dependency Security
# -------------------------------

    - name: NPM Dependency Audit
      run: |
        npm audit --audit-level=high



# -------------------------------
# GitHub CodeQL Security Scan
# -------------------------------

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript


    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:javascript"



# -------------------------------
# SonarQube Code Quality
# -------------------------------

    - name: SonarQube Scan

      if: ${{ secrets.SONAR_TOKEN != '' }}

      uses: SonarSource/sonarqube-scan-action@v5

      env:

        SONAR_TOKEN:
          ${{ secrets.SONAR_TOKEN }}

        SONAR_HOST_URL:
          ${{ secrets.SONAR_HOST_URL }}

      with:

        args: >
          -Dsonar.projectKey=enterprise-playwright-framework
          -Dsonar.sources=src
          -Dsonar.tests=tests



# ============================================
# Playwright Automation
# ============================================

  playwright-tests:


    name: Playwright Automated Tests

    needs: security-quality-gates

    runs-on: ubuntu-latest


    timeout-minutes: 60


    steps:


    - name: Checkout repository
      uses: actions/checkout@v4



    - name: Setup Node.js

      uses: actions/setup-node@v4

      with:

        node-version: 20
        cache: npm



    - name: Install dependencies

      run: npm ci



    - name: Install Playwright browsers

      run: |

        npx playwright install --with-deps



    - name: Execute Playwright Tests

      run: |

        npx playwright test



    - name: Upload Playwright Report

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: playwright-report

        path: |

          playwright-report/

          test-results/

        retention-days: 30